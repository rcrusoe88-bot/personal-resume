<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{name}} - 个人简历（致宋·叙事时间线）</title>
<style>
  @font-face {
    font-family: 'LXGW ZhiSong';
    src: url('assets/fonts/LXGWZhiSongMN.ttf') format('truetype');
    font-display: swap;
  }
  :root {
    --primary: {{primary_color}};
    --deep: {{deep_color}};
    --soft: {{soft_color}};
    --line: {{line_color}};
    --ink: #373230;
    --muted: #978B86;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #E8E4E0;
    display: flex; justify-content: center;
    padding: 24px 12px;
    font-family: 'LXGW ZhiSong', 'Songti SC', 'STSong', 'SimSun', serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .page {
    width: 210mm; min-height: 297mm;
    background: #FFFFFF;
    box-shadow: 0 8px 40px rgba(0,0,0,.12);
    overflow: hidden;
  }
  /* ---------- 顶部横幅 ---------- */
  .banner {
    background: var(--primary);
    color: var(--deep);
    padding: 12mm 18mm 10mm;
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .banner h1 { font-size: 34px; font-weight: 400; letter-spacing: .16em; line-height: 1.2; color: #FFF; }
  .banner .en { font-size: 10px; letter-spacing: .34em; margin-top: 2mm; opacity: .9; }
  .banner .meta { text-align: right; font-size: 10.5px; line-height: 1.9; }
  .banner .meta b { font-weight: 400; color: #FFF; }
  /* ---------- 正文 ---------- */
  .body { padding: 7mm 18mm 8mm; display: flex; flex-direction: column; gap: 5mm; }
  .sec h2 {
    font-size: 12.5px; font-weight: 400; color: var(--primary);
    letter-spacing: .26em; text-indent: .26em; margin-bottom: 3.5mm;
  }
  .sec h2::after { content: ""; display: block; width: 18mm; height: 2px; background: var(--primary); margin-top: 1.5mm; }
  .summary { font-size: 10.6px; line-height: 1.6; color: #554F4C; text-align: justify; }
  /* ---------- 时间线 ---------- */
  .tl { position: relative; padding-left: 9mm; }
  .tl::before { content: ""; position: absolute; left: 1.6mm; top: 2mm; bottom: 2mm; width: 1.5px; background: var(--line); }
  .tl .experience { position: relative; margin-bottom: 3.5mm; }
  .tl .experience::before {
    content: ""; position: absolute; left: -8.4mm; top: 1.4mm;
    width: 2.4mm; height: 2.4mm; border-radius: 50%;
    background: var(--primary); box-shadow: 0 0 0 1.5px var(--primary);
  }
  .exp-date {
    display: inline-block; font-size: 9.3px; letter-spacing: .1em;
    color: var(--deep); background: var(--soft);
    padding: .4mm 2.4mm; border-radius: 3px; margin-bottom: 1.2mm;
  }
  .exp-company { font-size: 12.5px; color: var(--ink); }
  .exp-position { font-size: 10.3px; color: var(--muted); margin: .6mm 0 1.2mm; }
  .exp-description ul { padding-left: 4.5mm; }
  .exp-description li { font-size: 10px; line-height: 1.5; color: #5A544F; text-align: justify; }
  .exp-description li::marker { color: var(--primary); }
  .project { margin-bottom: 2.5mm; }
  .project-name { font-size: 11.8px; color: var(--ink); margin-bottom: .8mm; }
  .project-detail { font-size: 10px; color: #5A544F; line-height: 1.6; text-align: justify; }
  .project-detail ul { padding-left: 4mm; }
  .project-detail li::marker { color: var(--primary); }
  .edu { font-size: 10.3px; line-height: 1.7; color: #5A544F; }
  .edu b { font-weight: 400; color: var(--ink); }
  .skill-tag {
    display: inline-block; font-size: 9.8px; color: var(--deep);
    border: 1px solid var(--primary); padding: .6mm 2.2mm; border-radius: 3px;
    margin: 0 1.2mm 1.6mm 0;
  }
  .honor-tag { font-size: 10.3px; color: #5A544F; line-height: 1.7; }
  .honor-tag::before { content: "✦ "; color: var(--primary); }
  .skills-honors { font-size: 10.3px; line-height: 1.7; color: #5A544F; }
  @media print {
    body { background: none; padding: 0; }
    .page { box-shadow: none; }
    @page { size: A4; margin: 0; }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="banner">
      <div>
        <h1>{{name_display}}</h1>
        <div class="en">PERSONAL RESUME</div>
      </div>
      <div class="meta">
        <b>电话</b>&nbsp;&nbsp;{{contact_phone}}<br>
        <b>邮箱</b>&nbsp;&nbsp;{{contact_email}}<br>
        <b>城市</b>&nbsp;&nbsp;{{contact_city}}
      </div>
    </header>

    <div class="body">
      <section class="sec">
        <h2>个人简介</h2>
        <p class="summary">{{summary}}</p>
      </section>

      <section class="sec">
        <h2>工作经历</h2>
        <div class="tl">
          {{experiences}}
        </div>
      </section>

      <section class="sec">
        <h2>项目与教育</h2>
        <div class="tl">
          {{projects}}
          <div class="experience">
            <span class="exp-date">{{education_date}}</span>
            <div class="exp-header"><span class="exp-company">{{education_school}}</span></div>
            <p class="exp-position">{{education_major}}</p>
            <div class="exp-description"><p style="font-size:10.2px;color:#5A544F">{{education_research}}</p></div>
          </div>
        </div>
      </section>

      <section class="sec">
        <h2>技能与荣誉</h2>
        <div class="skills-honors">
          {{skills}}<br><br>
          {{honors}}
        </div>
      </section>
    </div>
  </div>
</body>
</html>
