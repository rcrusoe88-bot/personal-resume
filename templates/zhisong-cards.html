<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{name}} - 个人简历（致宋·圆角卡片）</title>
<style>
  @font-face {
    font-family: 'LXGW ZhiSong';
    src: url('assets/fonts/LXGWZhiSongMN.ttf') format('truetype');
    font-display: swap;
  }
  :root {
    --primary: {{primary_color}};
    --deep: {{deep_color}};
    --soft: {{soft_color}};
    --line: {{line_color}};
    --ink: #373230;
    --muted: #988C87;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #E7E3DF;
    display: flex; justify-content: center;
    padding: 24px 12px;
    font-family: 'LXGW ZhiSong', 'Songti SC', 'STSong', 'SimSun', serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .page {
    width: 210mm; min-height: 297mm;
    background: var(--soft);
    padding: 9mm 12mm;
    box-shadow: 0 8px 40px rgba(0,0,0,.12);
  }
  /* ---------- 姓名卡 ---------- */
  .hero {
    background: linear-gradient(130deg, var(--primary), var(--deep));
    border-radius: 6mm;
    color: #FFFFFF;
    padding: 9mm 12mm;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.2);
  }
  .hero h1 { font-size: 32px; font-weight: 400; letter-spacing: .14em; line-height: 1.2; }
  .hero .en { font-size: 9.5px; letter-spacing: .3em; margin-top: 1.5mm; opacity: .92; }
  .hero .meta { text-align: right; font-size: 10.5px; line-height: 1.8; }
  .hero .meta b { font-weight: 400; }
  /* ---------- 卡片网格 ---------- */
  .grid { margin-top: 6mm; display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; }
  .card { background: #FFFFFF; border-radius: 4mm; padding: 5mm 6mm; box-shadow: 0 2px 8px rgba(0,0,0,.06); border: 1px solid var(--line); }
  .card.full { grid-column: 1 / -1; }
  .card h2 {
    display: inline-block; font-size: 11.5px; font-weight: 400; letter-spacing: .24em; text-indent: .24em;
    color: #FFF; background: var(--primary);
    padding: .8mm 3.5mm; border-radius: 3mm; margin-bottom: 3mm;
  }
  .summary { font-size: 10.6px; line-height: 1.65; color: #57504D; text-align: justify; }
  .experience { margin-bottom: 3.2mm; }
  .experience:last-child { margin-bottom: 0; }
  .exp-header { display: flex; justify-content: space-between; align-items: baseline; }
  .exp-company { font-size: 12px; color: var(--ink); }
  .exp-date { font-size: 9.5px; color: var(--muted); }
  .exp-position { font-size: 10.1px; color: var(--deep); margin: .5mm 0 1.2mm; }
  .exp-description ul { padding-left: 4.2mm; }
  .exp-description li { font-size: 10px; line-height: 1.6; color: #5D5652; text-align: justify; }
  .exp-description li::marker { color: var(--primary); }
  .project { margin-bottom: 2.8mm; }
  .project:last-child { margin-bottom: 0; }
  .project-name { font-size: 11.3px; color: var(--ink); margin-bottom: .8mm; }
  .project-detail { font-size: 9.8px; color: #5D5652; line-height: 1.6; text-align: justify; }
  .project-detail ul { padding-left: 4mm; }
  .project-detail li::marker { color: var(--primary); }
  .skill-tag {
    display: inline-block; font-size: 9.8px; color: var(--deep);
    background: var(--soft); border-radius: 8px;
    padding: .7mm 2.6mm; margin: 0 1.2mm 1.6mm 0;
  }
  .honor-tag {
    display: inline-block; font-size: 9.8px; color: var(--deep);
    border: 1px solid var(--primary); border-radius: 8px;
    padding: .6mm 2.4mm; margin: 0 1.2mm 1.6mm 0;
  }
  .highlight-item {
    background: var(--soft); border-left: 3px solid var(--primary);
    padding: 2mm 3mm; margin-bottom: 2mm;
  }
  .highlight-label { font-size: 9.5px; color: var(--muted); margin-bottom: .6mm; }
  .highlight-value { font-size: 10.3px; color: var(--ink); }
  .self { font-size: 10.1px; line-height: 1.7; color: #665C5A; text-align: justify; }
  .edu { font-size: 10.1px; line-height: 1.7; color: #5D5652; }
  .edu b { font-weight: 400; color: var(--ink); }
  @media print {
    body { background: none; padding: 0; }
    .page { box-shadow: none; }
    @page { size: A4; margin: 0; }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div>
        <h1>{{name_display}}</h1>
        <div class="en">PERSONAL RESUME</div>
      </div>
      <div class="meta">
        <b>电话</b>&nbsp;&nbsp;{{contact_phone}}<br>
        <b>邮箱</b>&nbsp;&nbsp;{{contact_email}}<br>
        <b>城市</b>&nbsp;&nbsp;{{contact_city}}
      </div>
    </header>

    <div class="grid">
      <div class="card full">
        <h2>个人简介</h2>
        <p class="summary">{{summary}}</p>
      </div>

      <div class="card">
        <h2>工作经历</h2>
        {{experiences}}
      </div>

      <div class="card">
        <h2>专业技能</h2>
        {{skills}}
        <div style="height:4mm"></div>
        <h2>教育背景</h2>
        <div class="edu">
          <b>{{education_school}}</b> · {{education_major}}<br>
          {{education_date}}
        </div>
      </div>

      <div class="card">
        <h2>项目经历</h2>
        {{projects}}
      </div>

      <div class="card">
        <h2>荣誉与自评</h2>
        {{honors}}
        <div style="height:2mm"></div>
        <p class="self">{{self_evaluation}}</p>
      </div>
    </div>
  </div>
</body>
</html>
